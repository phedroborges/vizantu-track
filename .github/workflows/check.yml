name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: track
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: track
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U track"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-never-deployed-0000000000000000000000000
      DEBUG: '0'
      DATABASE_URL: postgresql://track:test-only@127.0.0.1:5432/track
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,track.metricz.com.br
      CSRF_TRUSTED_ORIGINS: https://track.metricz.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test crm --verbosity 1
        env:
          DEBUG: '1'
      - name: Validate private schema for Supabase
        env:
          DATABASE_SCHEMA: track
        run: |
          python manage.py prepare_database
          python manage.py migrate --noinput
          python manage.py prepare_database --secure
          python manage.py shell -c "from django.db import connection; c=connection.cursor(); c.execute(\"SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'crm_%'\"); assert c.fetchone()[0] == 0; c.execute(\"SELECT count(*) FROM pg_tables WHERE schemaname='track' AND tablename LIKE 'crm_%' AND rowsecurity\"); assert c.fetchone()[0] > 10"
      - run: docker build -t track:check .

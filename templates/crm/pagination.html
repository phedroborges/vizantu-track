{% if items.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Paginação">{% if items.has_previous %}<a class="button secondary small" href="?{{ query }}&page={{ items.previous_page_number }}">← Anterior</a>{% else %}<span></span>{% endif %}<span class="muted">Página {{ items.number }} de {{ items.paginator.num_pages }}</span>{% if items.has_next %}<a class="button secondary small" href="?{{ query }}&page={{ items.next_page_number }}">Próxima →</a>{% else %}<span></span>{% endif %}</nav>{% endif %}
